<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tennis Pong</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #eef4fb;
    --muted: #8ba5c0;
    --dim: #5b7793;
    --navy-800: #071a2e;
    --navy-700: #0b2542;
    --lime: #d8f24a;
    --lime-ink: #0b1d10;
    --display: 'Barlow Condensed', 'Arial Narrow', system-ui, sans-serif;
    --body: 'Inter', system-ui, -apple-system, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    background:
      radial-gradient(1100px 520px at 50% -8%, rgba(38, 104, 163, 0.35) 0%, transparent 65%),
      linear-gradient(180deg, #061426 0%, #030a14 100%);
    color: var(--ink);
    font-family: var(--body);
    -webkit-font-smoothing: antialiased;
    display: flex;
    justify-content: center;
  }
  .app {
    width: min(1012px, 100%);
    padding: 24px 16px 32px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  /* ---------- Top bar ---------- */
  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
  }
  .brand { display: flex; align-items: center; gap: 12px; }
  .brand-mark { width: 40px; height: 40px; filter: drop-shadow(0 4px 10px rgba(216, 242, 74, 0.25)); }
  .brand-title {
    font-family: var(--display);
    font-weight: 800;
    font-size: 34px;
    line-height: 0.9;
    letter-spacing: 0.04em;
    text-transform: uppercase;
  }
  .brand-title em { font-style: normal; color: var(--lime); }
  .brand-sub {
    font-family: var(--display);
    font-weight: 600;
    font-size: 12px;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: var(--muted);
    margin-top: 5px;
  }

  /* ---------- Scoreboard ---------- */
  .scoreboard {
    font-family: var(--display);
    background: linear-gradient(180deg, var(--navy-700), var(--navy-800));
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 10px;
    overflow: hidden;
    box-shadow: 0 14px 34px rgba(0, 0, 0, 0.45);
    width: 400px;
    max-width: 100%;
  }
  .sb-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    height: 28px;
    padding: 0 8px 0 12px;
    background: rgba(0, 0, 0, 0.28);
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.24em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .sb-flag {
    opacity: 0;
    transform: translateY(-4px);
    transition: opacity 0.25s, transform 0.25s;
    padding: 3px 9px 2px;
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.1);
    color: var(--ink);
    letter-spacing: 0.18em;
  }
  .sb-flag.on { opacity: 1; transform: none; }
  .sb-flag.hot {
    background: var(--lime);
    color: var(--lime-ink);
    font-weight: 700;
    animation: pulse 1.3s ease-in-out infinite;
  }
  .sb-row {
    display: grid;
    grid-template-columns: 18px 1fr repeat(3, 32px) 58px;
    align-items: center;
    column-gap: 2px;
    height: 42px;
    padding-left: 12px;
    position: relative;
  }
  .sb-row + .sb-row { border-top: 1px solid rgba(255, 255, 255, 0.06); }
  .sb-serve {
    width: 10px; height: 10px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #f6ffc0, #cde83a 70%);
    box-shadow: 0 0 8px rgba(216, 242, 74, 0.75);
    opacity: 0;
    transform: scale(0.3);
    transition: opacity 0.3s, transform 0.35s cubic-bezier(0.2, 0.9, 0.3, 1.5);
  }
  .sb-serve.on { opacity: 1; transform: scale(1); }
  .sb-name {
    font-weight: 700;
    font-size: 21px;
    letter-spacing: 0.07em;
    text-transform: uppercase;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    transition: color 0.3s;
  }
  .sb-set {
    position: relative;
    text-align: center;
    font-weight: 600;
    font-size: 21px;
    font-variant-numeric: tabular-nums;
    color: #fff;
  }
  .sb-set.lost { color: var(--dim); }
  .sb-set.won { font-weight: 800; }
  .sb-set sup {
    position: absolute;
    top: -3px;
    font-size: 11px;
    font-weight: 600;
    color: var(--muted);
  }
  .sb-pts {
    height: 100%;
    display: grid;
    place-items: center;
    background: var(--lime);
    color: var(--lime-ink);
    font-weight: 800;
    font-size: 23px;
    font-variant-numeric: tabular-nums;
    transition: background 0.4s;
  }
  .sb-row + .sb-row .sb-pts { box-shadow: inset 0 1px 0 rgba(11, 29, 16, 0.18); }
  .scoreboard.over .sb-pts { background: transparent; }
  .sb-row.winner .sb-name { color: var(--lime); }
  .bump { animation: bump 0.38s cubic-bezier(0.2, 0.9, 0.3, 1.3); }
  .sb-row.flash::after {
    content: '';
    position: absolute;
    inset: 0;
    pointer-events: none;
    background: linear-gradient(90deg, rgba(216, 242, 74, 0.38), rgba(216, 242, 74, 0) 75%);
    animation: fadeOut 1.2s ease-out forwards;
  }

  /* ---------- Stage ---------- */
  .stage {
    position: relative;
    border-radius: 16px;
    overflow: hidden;
    background: #0a412f;
    box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.08), 0 28px 70px rgba(0, 0, 0, 0.55);
  }
  .stage canvas { display: block; width: 100%; height: auto; transition: filter 0.35s; }
  .stage.paused canvas { filter: saturate(0.35) brightness(0.55) blur(1.5px); }

  .glass {
    background: rgba(4, 13, 24, 0.58);
    -webkit-backdrop-filter: blur(8px);
    backdrop-filter: blur(8px);
    border: 1px solid rgba(255, 255, 255, 0.1);
  }
  .hud-speed {
    position: absolute;
    top: 9px;
    left: 50%;
    transform: translateX(calc(-100% - 28px));
    display: flex;
    align-items: baseline;
    gap: 7px;
    padding: 4px 11px 3px;
    border-radius: 8px;
    font-family: var(--display);
    opacity: 0;
    transition: opacity 0.3s;
    pointer-events: none;
  }
  .hud-speed.on { opacity: 1; }
  .hud-speed .label { font-size: 10px; font-weight: 600; letter-spacing: 0.24em; text-transform: uppercase; color: var(--muted); }
  .hud-speed .val { display: inline-block; font-size: 22px; font-weight: 800; color: #fff; font-variant-numeric: tabular-nums; }
  .hud-speed .unit { font-size: 11px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: var(--lime); }

  .prompt {
    position: absolute;
    left: 50%;
    bottom: 10px;
    transform: translate(-50%, 10px);
    opacity: 0;
    transition: opacity 0.3s, transform 0.3s;
    padding: 6px 15px 5px;
    border-radius: 999px;
    font-family: var(--display);
    font-weight: 600;
    font-size: 15px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    white-space: nowrap;
    pointer-events: none;
  }
  .prompt.on { opacity: 1; transform: translate(-50%, 0); }
  .stage.paused .prompt { bottom: 50%; transform: translate(-50%, 50%); font-size: 20px; padding: 10px 22px 9px; }

  .callout {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.4s;
  }
  .callout.show { opacity: 1; transition: opacity 0.15s; }
  .callout::before {
    content: '';
    position: absolute;
    left: 0; right: 0; top: 50%;
    height: 170px;
    transform: translateY(-50%);
    background: linear-gradient(90deg, rgba(4, 13, 24, 0) 0%, rgba(4, 13, 24, 0.62) 28%, rgba(4, 13, 24, 0.62) 72%, rgba(4, 13, 24, 0) 100%);
  }
  .callout.minor::before { height: 96px; }
  .callout > * { position: relative; }
  .callout-kicker {
    font-family: var(--display);
    font-weight: 700;
    font-size: 15px;
    letter-spacing: 0.42em;
    padding-left: 0.42em;
    text-transform: uppercase;
    color: var(--lime);
  }
  .callout-main {
    font-family: var(--display);
    font-weight: 800;
    font-size: clamp(44px, 8.5vw, 88px);
    line-height: 0.95;
    letter-spacing: 0.02em;
    text-transform: uppercase;
    color: #fff;
    text-shadow: 0 6px 28px rgba(0, 0, 0, 0.5);
  }
  .callout.minor .callout-main { font-size: clamp(30px, 5vw, 50px); letter-spacing: 0.06em; }
  .callout-sub {
    font-family: var(--display);
    font-weight: 600;
    font-size: 19px;
    letter-spacing: 0.22em;
    color: rgba(255, 255, 255, 0.78);
    margin-top: 4px;
  }
  .callout-kicker:empty, .callout-sub:empty { display: none; }
  .callout.show .callout-main { animation: slam 0.55s cubic-bezier(0.2, 0.9, 0.25, 1.15) both; }
  .callout.show .callout-kicker { animation: rise 0.45s ease-out both; }
  .callout.show .callout-sub { animation: rise 0.45s 0.12s ease-out both; }

  kbd {
    display: inline-grid;
    place-items: center;
    min-width: 26px;
    height: 26px;
    padding: 0 7px;
    border-radius: 6px;
    font-family: var(--display);
    font-weight: 700;
    font-size: 14px;
    letter-spacing: 0.06em;
    color: #fff;
    background: linear-gradient(180deg, #1a3f66, #0e2a48);
    border: 1px solid rgba(255, 255, 255, 0.14);
    border-bottom-width: 3px;
    border-bottom-color: rgba(0, 0, 0, 0.45);
    vertical-align: middle;
  }
  .prompt kbd { height: 22px; min-width: 22px; font-size: 13px; margin: -3px 2px 0; border-bottom-width: 2px; }

  /* ---------- Controls ---------- */
  .controls { display: flex; flex-direction: column; align-items: center; gap: 12px; margin-top: 4px; }
  .keys { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px 26px; }
  .key-group { display: inline-flex; align-items: center; gap: 6px; }
  .key-group span {
    font-family: var(--display);
    font-weight: 600;
    font-size: 14px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--muted);
    margin-left: 4px;
  }
  .rules {
    margin: 0;
    font-size: 12.5px;
    letter-spacing: 0.01em;
    color: var(--dim);
    text-align: center;
    max-width: 640px;
    line-height: 1.6;
  }

  @keyframes slam {
    from { opacity: 0; transform: scale(1.4); letter-spacing: 0.18em; filter: blur(8px); }
    to   { opacity: 1; transform: none; filter: none; }
  }
  @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
  @keyframes bump { 0% { transform: scale(1); } 40% { transform: scale(1.28); } 100% { transform: scale(1); } }
  @keyframes fadeOut { from { opacity: 1; } to { opacity: 0; } }
  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(216, 242, 74, 0.55); }
    50% { box-shadow: 0 0 0 6px rgba(216, 242, 74, 0); }
  }

  @media (max-width: 640px) {
    .scoreboard { width: 100%; }
    .brand-title { font-size: 28px; }
  }
</style>
</head>
<body>
<main class="app">
  <header class="topbar">
    <div class="brand">
      <svg class="brand-mark" viewBox="0 0 40 40" aria-hidden="true">
        <defs>
          <radialGradient id="ballGrad" cx="35%" cy="30%" r="75%">
            <stop offset="0" stop-color="#f6ffc0"/>
            <stop offset="0.6" stop-color="#d8f24a"/>
            <stop offset="1" stop-color="#9fb81c"/>
          </radialGradient>
        </defs>
        <circle cx="20" cy="20" r="18" fill="url(#ballGrad)"/>
        <path d="M7 8.5c6.5 5.5 6.5 17.5 0 23M33 8.5c-6.5 5.5-6.5 17.5 0 23" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/>
      </svg>
      <div>
        <div class="brand-title">Tennis <em>Pong</em></div>
        <div class="brand-sub">Hard Court Championships</div>
      </div>
    </div>

    <section class="scoreboard" id="scoreboard" aria-live="polite">
      <div class="sb-top">
        <span>Singles &middot; Best of 3</span>
        <span class="sb-flag" id="pressure"></span>
      </div>
      <div class="sb-row" id="row0">
        <span class="sb-serve" id="serve0"></span>
        <span class="sb-name" id="p1name"></span>
        <span class="sb-set" id="p1set0"></span>
        <span class="sb-set" id="p1set1"></span>
        <span class="sb-set" id="p1set2"></span>
        <span class="sb-pts" id="p1point"></span>
      </div>
      <div class="sb-row" id="row1">
        <span class="sb-serve" id="serve1"></span>
        <span class="sb-name" id="p2name"></span>
        <span class="sb-set" id="p2set0"></span>
        <span class="sb-set" id="p2set1"></span>
        <span class="sb-set" id="p2set2"></span>
        <span class="sb-pts" id="p2point"></span>
      </div>
    </section>
  </header>

  <div class="stage" id="stage">
    <canvas id="court"></canvas>
    <div class="hud-speed glass" id="speed">
      <span class="label">Speed</span><span class="val" id="speedVal">0</span><span class="unit">km/h</span>
    </div>
    <div class="callout" id="callout">
      <div class="callout-kicker" id="calloutKicker"></div>
      <div class="callout-main" id="calloutMain"></div>
      <div class="callout-sub" id="calloutSub"></div>
    </div>
    <div class="prompt glass" id="prompt"></div>
  </div>

  <footer class="controls">
    <div class="keys">
      <span class="key-group"><kbd>&uarr;</kbd><kbd>&darr;</kbd><span>Move</span></span>
      <span class="key-group"><kbd>Space</kbd><span>Serve</span></span>
      <span class="key-group"><kbd>P</kbd><span>Pause</span></span>
      <span class="key-group"><kbd>2</kbd><span>Two players &middot; W / S</span></span>
      <span class="key-group"><kbd>R</kbd><span>New match</span></span>
    </div>
    <p class="rules">Traditional scoring: 15, 30, 40, deuce and advantage. Sets to six games, win by two, with a tiebreak at 6&ndash;6. Best of three sets.</p>
  </footer>
</main>

<script>
(() => {
  const W = 980, H = 480;
  const DPR = Math.min(window.devicePixelRatio || 1, 2);
  const canvas = document.getElementById('court');
  canvas.width = W * DPR;
  canvas.height = H * DPR;
  const ctx = canvas.getContext('2d');

  const $ = (id) => document.getElementById(id);
  const stageEl = $('stage');
  const scoreboardEl = $('scoreboard');
  const nameEls = [$('p1name'), $('p2name')];
  const pointEls = [$('p1point'), $('p2point')];
  const serveEls = [$('serve0'), $('serve1')];
  const rowEls = [$('row0'), $('row1')];
  const setEls = [0, 1, 2].map((s) => [$('p1set' + s), $('p2set' + s)]);
  const pressureEl = $('pressure');
  const promptEl = $('prompt');
  const calloutEl = $('callout');
  const calloutKicker = $('calloutKicker');
  const calloutMain = $('calloutMain');
  const calloutSub = $('calloutSub');
  const speedEl = $('speed');
  const speedVal = $('speedVal');

  const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
  const other = (i) => 1 - i;
  const TAU = Math.PI * 2;

  // ---------- Court geometry (real proportions, landscape) ----------
  const court = { left: 70, right: W - 70, top: 50, bottom: H - 50 };
  court.width = court.right - court.left;
  court.height = court.bottom - court.top;
  court.centerX = (court.left + court.right) / 2;
  court.centerY = (court.top + court.bottom) / 2;
  const alley = court.height * (4.5 / 36);
  court.singlesTop = court.top + alley;
  court.singlesBottom = court.bottom - alley;
  const serviceOffset = (court.width / 2) * (21 / 39);
  court.serviceLeftX = court.centerX - serviceOffset;
  court.serviceRightX = court.centerX + serviceOffset;

  // ---------- Pre-rendered court ----------
  const courtLayer = document.createElement('canvas');

  function grain(c, x, y, w, h, n) {
    for (let i = 0; i < n; i++) {
      c.fillStyle = Math.random() < 0.5 ? 'rgba(255,255,255,0.035)' : 'rgba(0,0,0,0.055)';
      c.fillRect(x + Math.random() * w, y + Math.random() * h, 1, 1);
    }
  }

  function buildCourt() {
    courtLayer.width = W * DPR;
    courtLayer.height = H * DPR;
    const c = courtLayer.getContext('2d');
    c.setTransform(DPR, 0, 0, DPR, 0, 0);

    const surround = c.createLinearGradient(0, 0, 0, H);
    surround.addColorStop(0, '#105c42');
    surround.addColorStop(1, '#0a3f2e');
    c.fillStyle = surround;
    c.fillRect(0, 0, W, H);
    grain(c, 0, 0, W, H, 5000);

    const surface = c.createLinearGradient(0, court.top, 0, court.bottom);
    surface.addColorStop(0, '#3585c6');
    surface.addColorStop(1, '#2367a2');
    c.fillStyle = surface;
    c.fillRect(court.left, court.top, court.width, court.height);
    grain(c, court.left, court.top, court.width, court.height, 7000);

    for (const x of [court.left, court.right]) {
      const wear = c.createRadialGradient(x, court.centerY, 0, x, court.centerY, 95);
      wear.addColorStop(0, 'rgba(255,255,255,0.07)');
      wear.addColorStop(1, 'rgba(255,255,255,0)');
      c.fillStyle = wear;
      c.fillRect(x - 95, court.centerY - 95, 190, 190);
    }

    const light = c.createRadialGradient(W / 2, H * 0.3, 40, W / 2, H / 2, W * 0.62);
    light.addColorStop(0, 'rgba(255,255,255,0.10)');
    light.addColorStop(1, 'rgba(0,0,0,0.22)');
    c.fillStyle = light;
    c.fillRect(0, 0, W, H);

    // lines
    c.fillStyle = '#f2f6fa';
    const T = 2.5, B = 4;
    const line = (x, y, w, h) => c.fillRect(x, y, w, h);
    line(court.left, court.top - T / 2, court.width, T);
    line(court.left, court.bottom - T / 2, court.width, T);
    line(court.left, court.singlesTop - T / 2, court.width, T);
    line(court.left, court.singlesBottom - T / 2, court.width, T);
    line(court.left - B / 2, court.top - T / 2, B, court.height + T);
    line(court.right - B / 2, court.top - T / 2, B, court.height + T);
    line(court.serviceLeftX - T / 2, court.singlesTop, T, court.singlesBottom - court.singlesTop);
    line(court.serviceRightX - T / 2, court.singlesTop, T, court.singlesBottom - court.singlesTop);
    line(court.serviceLeftX, court.centerY - T / 2, court.serviceRightX - court.serviceLeftX, T);
    line(court.left, court.centerY - T / 2, 10, T);
    line(court.right - 10, court.centerY - T / 2, 10, T);

    // painted wordmarks on the surround
    c.save();
    c.font = '700 15px "Barlow Condensed", "Arial Narrow", sans-serif';
    if ('letterSpacing' in c) c.letterSpacing = '9px';
    c.fillStyle = 'rgba(255,255,255,0.17)';
    c.textAlign = 'center';
    c.textBaseline = 'middle';
    c.fillText('TENNIS PONG', W * 0.73, 25);
    c.fillText('HARD COURT', W * 0.25, H - 25);
    c.fillText('CHAMPIONSHIPS', W * 0.75, H - 25);
    c.restore();

    // net
    const nt = court.top - 16, nb = court.bottom + 16;
    const shadow = c.createLinearGradient(court.centerX, 0, court.centerX + 18, 0);
    shadow.addColorStop(0, 'rgba(0,0,0,0.3)');
    shadow.addColorStop(1, 'rgba(0,0,0,0)');
    c.fillStyle = shadow;
    c.fillRect(court.centerX, nt, 18, nb - nt);
    c.fillStyle = 'rgba(10,14,20,0.78)';
    c.fillRect(court.centerX - 3.5, nt, 7, nb - nt);
    c.fillStyle = 'rgba(255,255,255,0.2)';
    for (let y = nt; y < nb; y += 4) c.fillRect(court.centerX - 3.5, y, 7, 1);
    c.fillStyle = '#fbfdff';
    c.fillRect(court.centerX - 1.3, nt, 2.6, nb - nt);
    c.fillRect(court.centerX - 3.5, court.centerY - 5, 7, 10);
    for (const y of [nt, nb]) {
      c.beginPath();
      c.arc(court.centerX, y, 5.5, 0, TAU);
      c.fillStyle = '#161b22';
      c.fill();
      c.beginPath();
      c.arc(court.centerX - 1.4, y - 1.4, 2, 0, TAU);
      c.fillStyle = 'rgba(255,255,255,0.35)';
      c.fill();
    }
  }

  // ---------- Entities ----------
  const PADDLE_W = 28, PADDLE_H = 96, PADDLE_SPEED = 6.5;

  function makePaddle(x) {
    return { x, y: H / 2 - PADDLE_H / 2, w: PADDLE_W, h: PADDLE_H, speed: PADDLE_SPEED,
             vy: 0, swing: 0, swingV: 0, push: 0, pushV: 0, vib: 0, glow: 0 };
  }
  const paddles = [makePaddle(22), makePaddle(W - 22 - PADDLE_W)];

  const ball = { x: W / 2, y: H / 2, r: 8, vx: 0, vy: 0, speed: 6, spin: 0, squash: 0, appear: 0, z: 0, trail: [] };

  let particles = [];
  let rings = [];
  let shake = 0;
  const edgeFlash = { side: 0, t: 0 };

  let twoPlayerMode = false;
  let paused = false;
  let pointInPlay = false;
  let serveAvailableAt = 0;
  let aiError = 0;
  let time = 0;
  const keys = {};

  // ---------- Tennis scoring ----------
  const match = {};

  function getNames() {
    return twoPlayerMode ? ['Player 1', 'Player 2'] : ['Computer', 'You'];
  }
  const nameOf = (i) => getNames()[i];

  function resetMatch() {
    Object.assign(match, {
      points: [0, 0], games: [0, 0], sets: [0, 0], setHistory: [],
      tiebreak: false, tb: [0, 0], server: 0, tbFirstServer: 0, over: false, winner: -1,
    });
    pointInPlay = false;
    paused = false;
    stageEl.classList.remove('paused');
    ball.trail.length = 0;
    ball.appear = 0;
    particles = [];
    rings = [];
    hideCallout();
    speedEl.classList.remove('on');
    serveAvailableAt = performance.now() + 400;
    renderScore();
    updatePrompt();
  }

  function currentServer() {
    if (!match.tiebreak) return match.server;
    const n = match.tb[0] + match.tb[1];
    const turn = n === 0 ? 0 : Math.floor((n + 1) / 2);
    return turn % 2 === 0 ? match.tbFirstServer : other(match.tbFirstServer);
  }

  function pointText(i) {
    if (match.tiebreak) return String(match.tb[i]);
    const p = match.points[i], o = match.points[other(i)];
    if (p >= 3 && o >= 3) return p > o ? 'AD' : '40';
    return ['0', '15', '30', '40'][p];
  }

  function umpireCall() {
    const words = ['Love', '15', '30', '40'];
    const s = match.points[match.server], r = match.points[other(match.server)];
    return s === r ? `${words[s]}–All` : `${words[s]}–${words[r]}`;
  }

  function awardPoint(w) {
    const l = other(w);
    if (match.tiebreak) {
      match.tb[w]++;
      if (match.tb[w] >= 7 && match.tb[w] - match.tb[l] >= 2) return winSet(w);
      return { kicker: 'Tiebreak', main: `${match.tb[0]}–${match.tb[1]}`, minor: true };
    }
    match.points[w]++;
    const a = match.points[w], b = match.points[l];
    if (a >= 4 && a - b >= 2) return winGame(w);
    if (a >= 3 && b >= 3) {
      return a === b ? { main: 'Deuce' } : { kicker: 'Advantage', main: nameOf(w) };
    }
    return { main: umpireCall(), minor: true };
  }

  function winGame(w) {
    const heldBy = match.server;
    match.games[w]++;
    match.points = [0, 0];
    match.server = other(match.server);
    const [g0, g1] = match.games;
    if (g0 === 6 && g1 === 6) {
      match.tiebreak = true;
      match.tb = [0, 0];
      match.tbFirstServer = match.server;
      return { kicker: `Game ${nameOf(w)}`, main: 'Tiebreak', sub: 'First to 7 · win by 2', flash: w };
    }
    if ((g0 >= 6 || g1 >= 6) && Math.abs(g0 - g1) >= 2) return winSet(w);
    return { kicker: w === heldBy ? 'Game' : 'Break of serve', main: nameOf(w), sub: `${g0}–${g1}`, flash: w };
  }

  function winSet(w) {
    const wasTiebreak = match.tiebreak;
    const entry = { g: [...match.games], tb: wasTiebreak ? [...match.tb] : null, winner: w };
    if (wasTiebreak) {
      entry.g[w]++;
      match.server = other(match.tbFirstServer);
    }
    match.setHistory.push(entry);
    match.sets[w]++;
    match.games = [0, 0];
    match.points = [0, 0];
    match.tiebreak = false;
    match.tb = [0, 0];
    if (match.sets[w] >= 2) {
      match.over = true;
      match.winner = w;
      return {
        kicker: 'Game, Set & Match', main: nameOf(w),
        sub: match.setHistory.map((s) => `${s.g[w]}–${s.g[other(w)]}`).join('   '),
        persist: true, flash: w,
      };
    }
    return { kicker: `Set ${match.setHistory.length}`, main: nameOf(w), sub: `${entry.g[0]}–${entry.g[1]}`, flash: w };
  }

  function gamePointFor(i) {
    const o = other(i);
    if (match.tiebreak) return match.tb[i] >= 6 && match.tb[i] > match.tb[o];
    return match.points[i] >= 3 && match.points[i] > match.points[o];
  }

  function setPointFor(i) {
    if (!gamePointFor(i)) return false;
    if (match.tiebreak) return true;
    const g = match.games[i] + 1;
    return g >= 6 && g - match.games[other(i)] >= 2;
  }

  function pressureLabel() {
    if (match.over) return '';
    for (const i of [0, 1]) if (setPointFor(i) && match.sets[i] === 1) return 'Match point';
    for (const i of [0, 1]) if (setPointFor(i)) return 'Set point';
    if (!match.tiebreak && gamePointFor(other(match.server))) return 'Break point';
    return match.tiebreak ? 'Tiebreak' : '';
  }

  function retrigger(el, cls) {
    el.classList.remove(cls);
    void el.offsetWidth;
    el.classList.add(cls);
  }

  function renderScore() {
    const names = getNames();
    for (const i of [0, 1]) nameEls[i].textContent = names[i];

    for (let s = 0; s < 3; s++) {
      for (const i of [0, 1]) {
        const el = setEls[s][i];
        const h = match.setHistory[s];
        el.className = 'sb-set';
        el.textContent = '';
        if (h) {
          el.append(String(h.g[i]));
          if (h.tb && h.winner !== i) {
            const sup = document.createElement('sup');
            sup.textContent = h.tb[i];
            el.append(sup);
          }
          el.classList.add(h.winner === i ? 'won' : 'lost');
        } else if (s === match.setHistory.length && !match.over) {
          el.textContent = match.games[i];
        }
      }
    }

    for (const i of [0, 1]) {
      const txt = match.over ? '' : pointText(i);
      if (pointEls[i].textContent !== txt) {
        pointEls[i].textContent = txt;
        retrigger(pointEls[i], 'bump');
      }
      serveEls[i].classList.toggle('on', !match.over && currentServer() === i);
      rowEls[i].classList.toggle('winner', match.over && match.winner === i);
    }
    scoreboardEl.classList.toggle('over', match.over);

    const label = pressureLabel();
    if (label) pressureEl.textContent = label;
    pressureEl.classList.toggle('on', !!label);
    pressureEl.classList.toggle('hot', !!label && label !== 'Tiebreak');
  }

  // ---------- Overlays ----------
  let calloutTimer = 0;
  function showCallout(ev) {
    calloutKicker.textContent = ev.kicker || '';
    calloutMain.textContent = ev.main || '';
    calloutSub.textContent = ev.sub || '';
    calloutEl.classList.toggle('minor', !!ev.minor);
    retrigger(calloutEl, 'show');
    clearTimeout(calloutTimer);
    if (!ev.persist) {
      calloutTimer = setTimeout(() => calloutEl.classList.remove('show'), ev.minor ? 950 : 1800);
    }
  }
  function hideCallout() {
    clearTimeout(calloutTimer);
    calloutEl.classList.remove('show');
  }

  function updatePrompt() {
    let html = '';
    if (match.over) html = 'Press <kbd>R</kbd> for a new match';
    else if (paused) html = 'Paused &middot; <kbd>P</kbd> to resume';
    else if (!pointInPlay) {
      const s = currentServer();
      if (!twoPlayerMode && s === 0) html = 'Computer to serve';
      else if (twoPlayerMode) html = `${nameOf(s)} to serve &middot; <kbd>Space</kbd>`;
      else html = 'Your serve &middot; <kbd>Space</kbd>';
    }
    if (html) promptEl.innerHTML = html;
    promptEl.classList.toggle('on', !!html);
  }

  // ---------- Effects ----------
  function intensity() {
    return clamp((ball.speed - 5.5) / 8, 0, 1);
  }

  function hitFx(p, dir) {
    const k = intensity();
    p.swingV += dir * (0.085 + 0.06 * k);
    p.pushV += dir * (2 + 1.6 * k);
    p.vib = 1;
    p.glow = 1;
    ball.squash = 1;
    shake = Math.max(shake, 1.5 + 3.5 * k);

    const cx = ball.x - dir * ball.r, cy = ball.y;
    const count = 10 + Math.round(12 * k);
    for (let i = 0; i < count; i++) {
      const a = (dir === 1 ? 0 : Math.PI) + (Math.random() - 0.5) * Math.PI * 1.15;
      const sp = (1.2 + Math.random() * 3.4) * (0.7 + k);
      particles.push({
        x: cx, y: cy, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
        life: 1, decay: 0.028 + Math.random() * 0.03, size: 0.9 + Math.random() * 2.1,
        color: Math.random() < 0.65 ? '228,255,106' : '255,255,255',
      });
    }
    rings.push({ x: cx, y: cy, life: 1, max: 24 + 22 * k, color: '228,255,106', width: 2.5 });

    const kmh = Math.round(62 + ball.speed * 11 + Math.random() * 4);
    speedVal.textContent = kmh;
    speedEl.classList.add('on');
    retrigger(speedVal, 'bump');
  }

  function wallFx(x, y) {
    rings.push({ x, y, life: 1, max: 14, color: '255,255,255', width: 1.5 });
    for (let i = 0; i < 5; i++) {
      const a = (y < H / 2 ? 0 : Math.PI) + Math.random() * Math.PI;
      particles.push({
        x, y, vx: Math.cos(a) * 1.4, vy: Math.sin(a) * 1.4,
        life: 0.7, decay: 0.04, size: 1 + Math.random(), color: '255,255,255',
      });
    }
  }

  // ---------- Game flow ----------
  function serve() {
    if (pointInPlay || match.over || paused) return;
    const s = currentServer();
    const dir = s === 0 ? 1 : -1;
    const angle = Math.random() * 0.5 - 0.25;
    ball.speed = 6;
    ball.vx = dir * ball.speed * Math.cos(angle);
    ball.vy = ball.speed * Math.sin(angle);
    ball.appear = 1;
    ball.trail.length = 0;
    pointInPlay = true;
    hitFx(paddles[s], dir);
    hideCallout();
    updatePrompt();
  }

  function pointOver(winner) {
    pointInPlay = false;
    edgeFlash.side = winner === 1 ? 0 : 1;
    edgeFlash.t = 1;
    const ev = awardPoint(winner);
    renderScore();
    if (ev.flash !== undefined) retrigger(rowEls[ev.flash], 'flash');
    showCallout(ev);
    ball.trail.length = 0;
    ball.appear = -0.8;
    serveAvailableAt = performance.now() + 600;
    updatePrompt();
  }

  function placeBallOnServer() {
    const s = currentServer(), p = paddles[s];
    ball.x = s === 0 ? p.x + p.w + ball.r + 5 : p.x - ball.r - 5;
    ball.y = p.y + 36;
    ball.z = 14 * Math.abs(Math.sin(time * 0.0055));
  }

  function bounceOff(p, dir) {
    const rel = clamp((ball.y - (p.y + p.h / 2)) / (p.h / 2), -1, 1);
    const ang = rel * (Math.PI / 3.2);
    ball.speed = Math.min(ball.speed * 1.06, 13.5);
    ball.vx = dir * ball.speed * Math.cos(ang);
    ball.vy = clamp(ball.speed * Math.sin(ang) + p.vy * 0.15, -ball.speed * 0.9, ball.speed * 0.9);
    ball.x = dir === 1 ? p.x + p.w + ball.r + 0.5 : p.x - ball.r - 0.5;
    aiError = (Math.random() - 0.5) * 56;
    hitFx(p, dir);
  }

  function stepBall(s) {
    ball.x += ball.vx * s;
    ball.y += ball.vy * s;

    if (ball.y - ball.r < 0) {
      ball.y = ball.r;
      ball.vy = Math.abs(ball.vy);
      wallFx(ball.x, 2);
    } else if (ball.y + ball.r > H) {
      ball.y = H - ball.r;
      ball.vy = -Math.abs(ball.vy);
      wallFx(ball.x, H - 2);
    }

    const L = paddles[0], R = paddles[1];
    const inY = (p) => ball.y + ball.r * 0.6 >= p.y && ball.y - ball.r * 0.6 <= p.y + p.h;
    if (ball.vx < 0 && ball.x - ball.r <= L.x + L.w && ball.x > L.x + L.w * 0.5 && inY(L)) bounceOff(L, 1);
    else if (ball.vx > 0 && ball.x + ball.r >= R.x && ball.x < R.x + R.w * 0.5 && inY(R)) bounceOff(R, -1);

    if (ball.x < -40) pointOver(1);
    else if (ball.x > W + 40) pointOver(0);
  }

  function moveAI(p, dt) {
    let target;
    if (pointInPlay && ball.vx < 0) target = ball.y + aiError;
    else if (pointInPlay) target = ball.y * 0.5 + H / 4;
    else target = H / 2 + Math.sin(time * 0.0015) * 24;
    const diff = target - (p.y + p.h / 2);
    const max = p.speed * 0.74 * dt;
    if (Math.abs(diff) > 3) p.y += Math.sign(diff) * Math.min(max, Math.abs(diff));
  }

  function springs(p, dt) {
    p.swingV += -p.swing * 0.22 * dt;
    p.swingV *= Math.pow(0.8, dt);
    p.swing += p.swingV * dt;
    p.pushV += -p.push * 0.22 * dt;
    p.pushV *= Math.pow(0.8, dt);
    p.push += p.pushV * dt;
    p.vib = Math.max(0, p.vib - 0.04 * dt);
    p.glow = Math.max(0, p.glow - 0.06 * dt);
  }

  function update(dt, now) {
    const [L, R] = paddles;
    const prevY = [L.y, R.y];

    R.y += ((keys.ArrowDown ? 1 : 0) - (keys.ArrowUp ? 1 : 0)) * R.speed * dt;
    if (twoPlayerMode) L.y += ((keys.s ? 1 : 0) - (keys.w ? 1 : 0)) * L.speed * dt;
    else moveAI(L, dt);

    paddles.forEach((p, i) => {
      p.y = clamp(p.y, 0, H - p.h);
      p.vy = (p.y - prevY[i]) / dt;
      springs(p, dt);
    });

    if (match.over) {
      ball.appear = Math.max(0, ball.appear - 0.05 * dt);
    } else if (!pointInPlay) {
      placeBallOnServer();
      ball.appear = Math.min(1, ball.appear + 0.05 * dt);
      if (!twoPlayerMode && currentServer() === 0 && now >= serveAvailableAt + 700) serve();
    } else {
      const steps = Math.max(1, Math.ceil(Math.hypot(ball.vx, ball.vy) * dt / 5));
      for (let i = 0; i < steps && pointInPlay; i++) stepBall(dt / steps);
      if (pointInPlay) {
        ball.spin += ball.speed * 0.07 * dt * Math.sign(ball.vx);
        ball.z = 3 + 9 * Math.sin(Math.PI * clamp((ball.x - 40) / (W - 80), 0, 1));
        ball.trail.push({ x: ball.x, y: ball.y });
        if (ball.trail.length > 12) ball.trail.shift();
      }
    }
    ball.squash = Math.max(0, ball.squash - 0.11 * dt);

    const drag = Math.pow(0.92, dt);
    for (const pt of particles) {
      pt.x += pt.vx * dt;
      pt.y += pt.vy * dt;
      pt.vx *= drag;
      pt.vy *= drag;
      pt.life -= pt.decay * dt;
    }
    particles = particles.filter((pt) => pt.life > 0);
    for (const rg of rings) rg.life -= 0.055 * dt;
    rings = rings.filter((rg) => rg.life > 0);

    shake *= Math.pow(0.84, dt);
    if (shake < 0.1) shake = 0;
    edgeFlash.t = Math.max(0, edgeFlash.t - 0.035 * dt);
  }

  // ---------- Racquet model ----------
  // Local space: head top at y=0, head 72 tall, throat to 96, grip to 125. Pivot at the hand.
  const HEAD_CY = 36, PIVOT_Y = 110;
  function headPoints(inset) {
    const rx = 14 - inset, ry = 36 - inset, pts = [];
    for (let i = 0; i < 72; i++) {
      const t = (i / 72) * TAU;
      const taper = 1 - 0.15 * (1 - Math.cos(t)) / 2;
      pts.push([rx * Math.sin(t) * taper, HEAD_CY - ry * Math.cos(t)]);
    }
    return pts;
  }
  const HEAD_OUTER = headPoints(0);
  const HEAD_MID = headPoints(1.8);
  const HEAD_INNER = headPoints(3.6);

  function tracePoints(pts, from = 0, to = pts.length, close = true) {
    for (let i = from; i < to; i++) {
      const [x, y] = pts[i % pts.length];
      if (i === from) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    if (close) ctx.closePath();
  }

  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  const THEMES = [
    { frameLight: '#3a7cc0', frameDark: '#0a2340', accent: '#d8f24a', grip: '#eef2f6', gripLine: 'rgba(10,35,64,0.3)' },
    { frameLight: '#6a707a', frameDark: '#0f1114', accent: '#ff6a3d', grip: '#1c1f24', gripLine: 'rgba(255,255,255,0.13)' },
  ];

  function drawRacquet(p, i) {
    const th = THEMES[i];
    ctx.save();
    ctx.translate(p.x + p.w / 2 + p.push, p.y);

    // cast shadow
    ctx.save();
    ctx.translate(5, 7);
    ctx.translate(0, PIVOT_Y); ctx.rotate(p.swing); ctx.translate(0, -PIVOT_Y);
    ctx.beginPath();
    tracePoints(HEAD_OUTER);
    ctx.fillStyle = 'rgba(0,0,0,0.13)';
    ctx.fill();
    roundRect(-4, 72, 8, 53, 3);
    ctx.fillStyle = 'rgba(0,0,0,0.22)';
    ctx.fill();
    ctx.restore();

    ctx.translate(0, PIVOT_Y); ctx.rotate(p.swing); ctx.translate(0, -PIVOT_Y);

    // throat arms
    const frameGrad = ctx.createLinearGradient(-14, 0, 14, 0);
    frameGrad.addColorStop(0, th.frameLight);
    frameGrad.addColorStop(0.55, th.frameDark);
    frameGrad.addColorStop(1, th.frameDark);
    ctx.lineCap = 'round';
    ctx.strokeStyle = frameGrad;
    ctx.lineWidth = 3.4;
    ctx.beginPath();
    ctx.moveTo(-7.6, 63); ctx.quadraticCurveTo(-5.6, 82, -2.5, 92);
    ctx.moveTo(7.6, 63); ctx.quadraticCurveTo(5.6, 82, 2.5, 92);
    ctx.stroke();

    // shaft + grip + butt cap
    roundRect(-3, 89, 6, 9, 2);
    ctx.fillStyle = th.frameDark;
    ctx.fill();
    roundRect(-4.2, 96, 8.4, 27, 2.5);
    ctx.fillStyle = th.grip;
    ctx.fill();
    ctx.save();
    ctx.clip();
    ctx.strokeStyle = th.gripLine;
    ctx.lineWidth = 1;
    ctx.beginPath();
    for (let y = 90; y < 128; y += 4.5) { ctx.moveTo(-6, y); ctx.lineTo(6, y + 5); }
    ctx.stroke();
    const gripShade = ctx.createLinearGradient(-4.2, 0, 4.2, 0);
    gripShade.addColorStop(0, 'rgba(255,255,255,0.18)');
    gripShade.addColorStop(1, 'rgba(0,0,0,0.25)');
    ctx.fillStyle = gripShade;
    ctx.fillRect(-5, 96, 10, 28);
    ctx.restore();
    ctx.fillStyle = th.accent;
    ctx.fillRect(-4.4, 95, 8.8, 2);
    roundRect(-4.8, 122, 9.6, 4.2, 1.6);
    ctx.fillStyle = th.frameDark;
    ctx.fill();

    // string bed
    ctx.save();
    ctx.beginPath();
    tracePoints(HEAD_INNER);
    ctx.clip();
    ctx.fillStyle = 'rgba(255,255,255,0.05)';
    ctx.fillRect(-15, 0, 30, 72);
    if (p.glow > 0) {
      const glow = ctx.createRadialGradient(0, HEAD_CY, 0, 0, HEAD_CY, 34);
      glow.addColorStop(0, `rgba(228,255,106,${0.45 * p.glow})`);
      glow.addColorStop(1, 'rgba(228,255,106,0)');
      ctx.fillStyle = glow;
      ctx.fillRect(-15, 0, 30, 72);
    }
    ctx.strokeStyle = 'rgba(255,255,255,0.78)';
    ctx.lineWidth = 0.6;
    ctx.beginPath();
    const mains = 9, crosses = 16;
    for (let k = 0; k < mains; k++) {
      const x = -10.4 + (20.8 / (mains - 1)) * k;
      const wobble = Math.sin(time * 0.09 + k * 1.7) * 1.6 * p.vib;
      ctx.moveTo(x, 0);
      ctx.quadraticCurveTo(x + wobble, HEAD_CY, x, 72);
    }
    for (let k = 0; k < crosses; k++) {
      const y = 5 + (62 / (crosses - 1)) * k;
      const wobble = Math.sin(time * 0.1 + k * 1.3) * 1.2 * p.vib;
      ctx.moveTo(-15, y);
      ctx.quadraticCurveTo(0, y + wobble, 15, y);
    }
    ctx.stroke();
    // stencil chevrons
    ctx.globalAlpha = 0.6;
    ctx.fillStyle = th.accent;
    for (const oy of [27, 35]) {
      ctx.beginPath();
      ctx.moveTo(-5.5, oy + 5); ctx.lineTo(0, oy); ctx.lineTo(5.5, oy + 5);
      ctx.lineTo(5.5, oy + 8); ctx.lineTo(0, oy + 3); ctx.lineTo(-5.5, oy + 8);
      ctx.closePath();
      ctx.fill();
    }
    ctx.restore();

    // frame: dark tube, specular highlight, accent paint
    ctx.beginPath();
    tracePoints(HEAD_MID);
    ctx.lineJoin = 'round';
    if (p.glow > 0) {
      ctx.save();
      ctx.shadowColor = th.accent;
      ctx.shadowBlur = 14 * p.glow;
      ctx.strokeStyle = th.accent;
      ctx.lineWidth = 3.8;
      ctx.stroke();
      ctx.restore();
    }
    ctx.strokeStyle = frameGrad;
    ctx.lineWidth = 3.6;
    ctx.stroke();

    ctx.save();
    ctx.translate(-0.6, -0.6);
    ctx.beginPath();
    tracePoints(HEAD_MID, 50, 78, false);
    ctx.strokeStyle = 'rgba(255,255,255,0.45)';
    ctx.lineWidth = 1;
    ctx.stroke();
    ctx.restore();

    ctx.strokeStyle = th.accent;
    ctx.lineWidth = 1.3;
    ctx.beginPath(); tracePoints(HEAD_MID, 12, 24, false); ctx.stroke();
    ctx.beginPath(); tracePoints(HEAD_MID, 48, 60, false); ctx.stroke();

    ctx.restore();
  }

  // ---------- Ball ----------
  function drawBall() {
    const a = clamp(ball.appear, 0, 1);
    if (a <= 0) return;
    const lift = ball.z;
    const r = ball.r * (0.55 + 0.45 * a) * (1 + lift * 0.012);
    const drawY = ball.y - lift * 0.45;

    ctx.fillStyle = `rgba(0,0,0,${(0.3 - lift * 0.008) * a})`;
    ctx.beginPath();
    ctx.ellipse(ball.x + 3 + lift * 0.5, ball.y + 4 + lift * 0.45, ball.r * 1.05, ball.r * 0.8, 0, 0, TAU);
    ctx.fill();

    if (pointInPlay) {
      const k = 0.35 + intensity();
      const n = ball.trail.length;
      for (let i = 0; i < n; i++) {
        const t = ball.trail[i], f = (i + 1) / n;
        ctx.fillStyle = `rgba(228,255,106,${0.16 * f * k})`;
        ctx.beginPath();
        ctx.arc(t.x, t.y - lift * 0.45, r * (0.35 + 0.6 * f), 0, TAU);
        ctx.fill();
      }
    }

    ctx.save();
    ctx.globalAlpha = a;
    ctx.translate(ball.x, drawY);
    if (ball.squash > 0) {
      const s = ball.squash;
      ctx.scale(1 - 0.3 * s, 1 + 0.22 * s);
    }
    const body = ctx.createRadialGradient(-r * 0.35, -r * 0.4, r * 0.1, 0, 0, r);
    body.addColorStop(0, '#f6ffc0');
    body.addColorStop(0.55, '#d9f23f');
    body.addColorStop(1, '#a3bd1c');
    ctx.fillStyle = body;
    ctx.beginPath();
    ctx.arc(0, 0, r, 0, TAU);
    ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,220,0.35)';
    ctx.lineWidth = 1;
    ctx.stroke();

    ctx.save();
    ctx.clip();
    ctx.rotate(ball.spin);
    ctx.strokeStyle = 'rgba(255,255,255,0.92)';
    ctx.lineWidth = 1.3;
    ctx.beginPath();
    ctx.arc(-r * 1.05, 0, r * 0.85, -1.05, 1.05);
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(r * 1.05, 0, r * 0.85, Math.PI - 1.05, Math.PI + 1.05);
    ctx.stroke();
    ctx.restore();
    ctx.restore();
  }

  function drawEffects() {
    for (const rg of rings) {
      const radius = rg.max * (1 - rg.life * rg.life) + 4;
      ctx.strokeStyle = `rgba(${rg.color},${0.8 * rg.life})`;
      ctx.lineWidth = rg.width * rg.life + 0.3;
      ctx.beginPath();
      ctx.arc(rg.x, rg.y, radius, 0, TAU);
      ctx.stroke();
    }
    for (const pt of particles) {
      ctx.fillStyle = `rgba(${pt.color},${Math.max(0, pt.life)})`;
      ctx.beginPath();
      ctx.arc(pt.x, pt.y, pt.size * (0.4 + 0.6 * pt.life), 0, TAU);
      ctx.fill();
    }
  }

  function drawEdgeFlash() {
    if (edgeFlash.t <= 0) return;
    const w = 140;
    const x0 = edgeFlash.side === 0 ? 0 : W;
    const g = ctx.createLinearGradient(x0, 0, edgeFlash.side === 0 ? w : W - w, 0);
    g.addColorStop(0, `rgba(255,255,255,${0.32 * edgeFlash.t})`);
    g.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = g;
    ctx.fillRect(edgeFlash.side === 0 ? 0 : W - w, 0, w, H);
  }

  function draw() {
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.fillStyle = '#0a412f';
    ctx.fillRect(0, 0, W, H);
    ctx.save();
    if (shake) ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
    ctx.drawImage(courtLayer, 0, 0, W, H);
    drawEdgeFlash();
    paddles.forEach(drawRacquet);
    drawBall();
    drawEffects();
    ctx.restore();
  }

  // ---------- Input ----------
  const keyName = (e) => (e.key.length === 1 ? e.key.toLowerCase() : e.key);

  window.addEventListener('keydown', (e) => {
    if (['ArrowUp', 'ArrowDown', ' '].includes(e.key)) e.preventDefault();
    const k = keyName(e);
    keys[k] = true;
    if (e.repeat) return;
    if (k === ' ') {
      if ((twoPlayerMode || currentServer() === 1) && performance.now() >= serveAvailableAt) serve();
    } else if (k === 'p') {
      if (match.over) return;
      paused = !paused;
      stageEl.classList.toggle('paused', paused);
      updatePrompt();
    } else if (k === 'r') {
      resetMatch();
    } else if (k === '2') {
      twoPlayerMode = !twoPlayerMode;
      renderScore();
      updatePrompt();
      if (!match.over) {
        showCallout(twoPlayerMode
          ? { kicker: 'Mode', main: 'Two Players', sub: 'W / S  ·  ↑ / ↓' }
          : { kicker: 'Mode', main: 'One Player', sub: 'You play with ↑ / ↓' });
      }
    }
  });
  window.addEventListener('keyup', (e) => { keys[keyName(e)] = false; });
  window.addEventListener('blur', () => { for (const k in keys) keys[k] = false; });

  // ---------- Main loop ----------
  let last = performance.now();
  function frame(now) {
    const dt = Math.min(3, (now - last) / (1000 / 60));
    last = now;
    time = now;
    if (!paused) update(dt, now);
    draw();
    requestAnimationFrame(frame);
  }

  buildCourt();
  if (document.fonts) document.fonts.ready.then(buildCourt);
  resetMatch();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
